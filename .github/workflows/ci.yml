name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0
  NODE_VERSION: "22"

jobs:
  test-and-build:
    name: Test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The TypeScript types are generated from the Go services and are not committed.
      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # main.go embeds frontend/dist, so the frontend must be built before any Go step.
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet . ./internal/...

      - name: Go tests
        run: go test ./internal/...

      - name: Build (amd64)
        shell: bash
        run: |
          set -euo pipefail
          wails3 build
          ./bin/docklet.exe --version | tee /dev/stderr | grep -q "^Docklet "
          mkdir -p dist
          mv bin/docklet.exe dist/docklet-windows-amd64.exe

      # Go cross-compiles windows/arm64 without cgo. The architecture is selected with GOARCH
      # (this also makes the generated .syso resource file arm64). Build only: it cannot run on this runner.
      - name: Build (arm64)
        shell: bash
        env:
          GOARCH: arm64
        run: |
          set -euo pipefail
          wails3 build
          mv bin/docklet.exe dist/docklet-windows-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: docklet-windows-amd64
          path: dist/docklet-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: docklet-windows-arm64
          path: dist/docklet-windows-arm64.exe
          if-no-files-found: error
          retention-days: 14

  # Linux: exercises the non-Windows code paths (unix sockets, proc_other.go, path handling),
  # builds the GTK4 / WebKitGTK 6.0 app and smoke-tests that it starts under a virtual display.
  # Nobody has used the Linux build interactively yet; this job is the only evidence it works.
  linux:
    name: Test, build and smoke test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails v3.1 links GTK 4 and WebKitGTK 6.0 (the list `wails3 doctor` checks on apt systems).
      # xvfb, dbus and Mesa are only needed for the smoke test.
      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            xvfb dbus dbus-x11 libgl1-mesa-dri

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet . ./internal/...

      - name: Go tests
        run: go test ./internal/...

      - name: Build
        run: wails3 build

      - name: Version flag
        shell: bash
        run: |
          set -euo pipefail
          ./bin/docklet --version | tee /dev/stderr | grep -q "^Docklet "

      # Start the real app under a virtual display and a private session bus, wait, and require
      # that it is still running. A crash on startup (missing library, WebKit failure) fails the job.
      - name: Smoke test (xvfb)
        shell: bash
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/docklet-home"
          mkdir -p "$HOME"
          cat > "$RUNNER_TEMP/smoke.sh" <<'SMOKE'
          #!/usr/bin/env bash
          set -uo pipefail
          ./bin/docklet > "$RUNNER_TEMP/docklet.log" 2>&1 &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "docklet is still running after 15s"
            kill "$pid"
            exit 0
          fi
          wait "$pid"
          echo "docklet exited early with status $?"
          exit 1
          SMOKE
          chmod +x "$RUNNER_TEMP/smoke.sh"
          status=0
          xvfb-run -a --server-args="-screen 0 1440x900x24" dbus-run-session -- "$RUNNER_TEMP/smoke.sh" || status=$?
          echo "---- application log ----"
          cat "$RUNNER_TEMP/docklet.log" || true
          exit "$status"

      - uses: actions/upload-artifact@v4
        with:
          name: docklet-linux-amd64
          path: bin/docklet
          if-no-files-found: error
          retention-days: 14

  # macOS (Apple Silicon): vet, tests and a build. Nobody here has a Mac to debug on, so this job
  # may fail without blocking the others; check its log when it does.
  macos:
    name: Test and build (macOS)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet . ./internal/...

      - name: Go tests
        run: go test ./internal/...

      # Produces bin/docklet.app. Signing and notarisation would go here (see build/darwin/Taskfile.yml,
      # `wails3 setup signing`); no Apple certificate is available.
      - name: Package
        run: wails3 package

      - name: Zip the app
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent bin/docklet.app bin/docklet-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: docklet-macos-arm64
          path: bin/docklet-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
