name: CI

# Runners: jobs run on the self-hosted Windows runner (labels self-hosted, Windows, X64) unless the
# repository variable HOSTED_RUNNERS is 'true', which switches back to GitHub-hosted machines and enables the
# native Linux and macOS jobs. Linux is covered on the self-hosted runner by a Docker container when the
# variable RUNNER_HAS_DOCKER is 'true' (the runner's service account must be allowed to use Docker).

on:
  push:
    branches: [main]
    # Text and pictures cannot break the build.
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0
  NODE_VERSION: "22"

jobs:
  test-and-build:
    name: Test and build (Windows)
    runs-on: ${{ fromJSON(vars.HOSTED_RUNNERS == 'true' && '"windows-latest"' || '["self-hosted","Windows","X64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # On a self-hosted Windows machine plain "bash" can resolve to the WSL launcher in System32.
      - name: Use Git Bash on the self-hosted runner
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: '"C:/Program Files/Git/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The TypeScript types are generated from the Go services and are not committed.
      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # main.go embeds frontend/dist, so the frontend must be built before any Go step.
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet . ./internal/...

      - name: Go tests
        run: go test ./internal/...

      - name: Build (amd64)
        shell: bash
        run: |
          set -euo pipefail
          wails3 build
          reported="$(./bin/docklet.exe --version)"
          echo "$reported"
          echo "$reported" | grep -q "^Docklet "
          mkdir -p dist
          mv bin/docklet.exe dist/docklet-windows-amd64.exe

      # Go cross-compiles windows/arm64 without cgo. The architecture is selected with GOARCH
      # (this also makes the generated .syso resource file arm64). Build only: it cannot run on this runner.
      - name: Build (arm64)
        shell: bash
        env:
          GOARCH: arm64
        run: |
          set -euo pipefail
          wails3 build
          mv bin/docklet.exe dist/docklet-windows-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: docklet-windows-amd64
          path: dist/docklet-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: docklet-windows-arm64
          path: dist/docklet-windows-arm64.exe
          if-no-files-found: error
          retention-days: 14

  # Linux: exercises the non-Windows code paths (unix sockets, proc_other.go, path handling),
  # builds the GTK4 / WebKitGTK 6.0 app and smoke-tests that it starts under a virtual display.
  # Nobody has used the Linux build interactively yet; this job is the only evidence it works.
  linux:
    name: Test, build and smoke test (Linux)
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails v3.1 links GTK 4 and WebKitGTK 6.0 (the list `wails3 doctor` checks on apt systems).
      # xvfb, dbus and Mesa are only needed for the smoke test.
      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            xvfb dbus dbus-x11 libgl1-mesa-dri

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet . ./internal/...

      - name: Go tests
        run: go test ./internal/...

      - name: Build
        run: wails3 build

      - name: Version flag
        shell: bash
        run: |
          set -euo pipefail
          reported="$(./bin/docklet --version)"
          echo "$reported"
          echo "$reported" | grep -q "^Docklet "

      - name: Build the .deb
        run: wails3 task linux:create:deb VERSION=0.0.0-ci

      # The runner is a stock Ubuntu 24.04: unprivileged user namespaces are restricted by AppArmor and
      # nothing here relaxes that. The smoke steps below use .github/scripts/linux-smoke.sh (Xvfb + a
      # private session bus) and print the application log whether they pass or fail.
      - name: Runner restricts user namespaces
        shell: bash
        run: |
          set -euo pipefail
          value="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          echo "kernel.apparmor_restrict_unprivileged_userns=$value"
          command -v bwrap
          if [ "$value" != "1" ]; then
            echo "::warning::The runner no longer restricts user namespaces; the next steps prove nothing about AppArmor."
          fi

      # No profile applies to ./bin/docklet, so WebKit's sandbox cannot start. Docklet must say so and exit
      # with status 78 instead of crashing with SIGTRAP inside WebKit.
      - name: Binary without a profile refuses with a clear message
        shell: bash
        env:
          HOME: ${{ runner.temp }}/home-refuses
          DOCKLET_LOG: ${{ runner.temp }}/refuses.log
        run: bash .github/scripts/linux-smoke.sh refuses "$PWD/bin/docklet"

      - name: Binary without a profile starts with the sandbox opt-out
        shell: bash
        env:
          HOME: ${{ runner.temp }}/home-optout
          DOCKLET_LOG: ${{ runner.temp }}/optout.log
          DOCKLET_DISABLE_WEBKIT_SANDBOX: "1"
        run: bash .github/scripts/linux-smoke.sh stays-up "$PWD/bin/docklet"

      - name: Install the .deb and check the AppArmor profile is loaded
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./bin/*.deb
          test -x /usr/bin/docklet
          sudo cat /sys/kernel/security/apparmor/profiles | grep -E '^docklet '

      # The installed binary is covered by the profile, so it starts with the WebKit sandbox enabled.
      - name: Installed binary starts with the sandbox enabled
        shell: bash
        env:
          HOME: ${{ runner.temp }}/home-installed
          DOCKLET_LOG: ${{ runner.temp }}/installed.log
        run: bash .github/scripts/linux-smoke.sh stays-up /usr/bin/docklet

      - uses: actions/upload-artifact@v4
        with:
          name: docklet-linux-amd64
          path: bin/docklet
          if-no-files-found: error
          retention-days: 14

  # Linux on the self-hosted Windows runner: the same vet, tests and build inside a Docker container.
  # It cannot run the .deb and AppArmor smoke tests of the job above (those need a real Ubuntu machine).
  linux-container:
    name: Test and build (Linux, container)
    if: vars.HOSTED_RUNNERS != 'true' && vars.RUNNER_HAS_DOCKER == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the Linux toolchain image
        shell: pwsh
        run: |
          $go = (Select-String -Path go.mod -Pattern '^go ([0-9.]+)').Matches[0].Groups[1].Value
          docker build -f .github/ci/linux.Dockerfile --build-arg "GO_VERSION=$go" --build-arg "WAILS_VERSION=$env:WAILS_VERSION" -t docklet-ci-linux .github/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vet, test and build in the container
        shell: pwsh
        run: |
          docker run --rm -v "${env:GITHUB_WORKSPACE}:/src:ro" -v docklet-ci-gomod:/root/go/pkg/mod -v docklet-ci-gobuild:/root/.cache/go-build -v docklet-ci-npm:/root/.npm docklet-ci-linux bash /src/.github/scripts/linux-container.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # macOS (Apple Silicon): vet, tests and a build. Nobody here has a Mac to debug on, so this job
  # may fail without blocking the others; check its log when it does.
  macos:
    name: Test and build (macOS)
    if: vars.HOSTED_RUNNERS == 'true'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet . ./internal/...

      - name: Go tests
        run: go test ./internal/...

      # Produces bin/docklet.app. Signing and notarisation would go here (see build/darwin/Taskfile.yml,
      # `wails3 setup signing`); no Apple certificate is available.
      - name: Package
        run: wails3 package

      - name: Zip the app
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent bin/docklet.app bin/docklet-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: docklet-macos-arm64
          path: bin/docklet-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
