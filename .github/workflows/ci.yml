name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0
  NODE_VERSION: "22"

jobs:
  test-and-build:
    name: Test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The TypeScript types are generated from the Go services and are not committed.
      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      # main.go embeds frontend/dist, so the frontend must be built before any Go step.
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet . ./internal/...

      - name: Go tests
        run: go test ./internal/...

      - name: Build
        run: wails3 build

      - uses: actions/upload-artifact@v4
        with:
          name: docklet-windows-amd64
          path: bin/docklet.exe
          if-no-files-found: error
          retention-days: 14
