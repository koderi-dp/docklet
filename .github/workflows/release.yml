name: Release

# Push a tag like v0.2.0 (or v0.2.0-rc.1 for a pre-release), or run this workflow by hand with a version.
# A manual run creates the tag on the commit it was started from.
# Runners: every job runs on a GitHub-hosted machine.
# The shared setup (Go, Node, Wails CLI, bindings, frontend build) is .github/actions/setup.
# Rerunning a run whose release already exists adds or replaces its files.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 or 0.2.0-rc.1 (without the leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        name: Derive version from the tag or input
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then raw="$INPUT_VERSION"; else raw="$REF_NAME"; fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a valid version (expected 1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # The gate: the whole CI workflow runs on the commit being released. Nothing is built unless it passes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Required. One installer per architecture, one after the other.
  # amd64 and arm64 are built unless the repository variable WINDOWS_ARCHES says otherwise, e.g. 'amd64'.
  windows:
    name: Windows (${{ vars.WINDOWS_ARCHES || 'amd64 arm64' }})
    needs: [prepare, ci]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCHES: ${{ vars.WINDOWS_ARCHES || 'amd64 arm64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install NSIS
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v makensis > /dev/null 2>&1 && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      # `wails3 package VERSION=...` embeds the version (-X docklet/internal/version.Version) in the binary.
      # The architecture is chosen with GOARCH; both builds write bin/docklet.exe and
      # bin/docklet-<arch>-installer.exe, so each output is renamed straight away.
      # Signing: no certificate is available. Sign the .exe before packaging and the installer after
      # (`wails3 task windows:sign` / `windows:sign:installer`, see build/windows/Taskfile.yml).
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in $ARCHES; do
            GOARCH="$arch" wails3 package "VERSION=$VERSION"
            if [[ "$arch" == "amd64" ]]; then
              reported="$(./bin/docklet.exe --version)"
              echo "$reported"
              echo "$reported" | grep -qx "Docklet $VERSION"
            fi
            mv bin/docklet.exe "dist/docklet-$VERSION-windows-$arch.exe"
            mv "bin/docklet-$arch-installer.exe" "dist/docklet-$VERSION-windows-$arch-installer.exe"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Required. Linux packages: AppImage and .deb. arm64 runs on GitHub's ubuntu-24.04-arm runner and is optional.
  linux:
    name: Linux (${{ matrix.arch }})
    needs: [prepare, ci]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, appimage_arch: x86_64, optional: false }
          - { arch: arm64, runner: ubuntu-24.04-arm, appimage_arch: aarch64, optional: true }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev file

      - uses: ./.github/actions/setup

      # Only the AppImage and the .deb are published (the scaffold can also make .rpm and Arch packages).
      # Names produced by the tools are matched with globs and renamed to the release asset names.
      - name: Package (AppImage and deb)
        shell: bash
        env:
          GIT_COMMITTER_NAME: Danijel
        run: |
          set -euo pipefail
          wails3 task linux:create:appimage "VERSION=$VERSION"
          wails3 task linux:create:deb "VERSION=$VERSION"
          # The profile that lets WebKit's sandbox start on Ubuntu 24.04 must be in the package.
          # Capture the listing first: `grep -q` exits at the first match and would make dpkg-deb fail under pipefail.
          deb_contents="$(dpkg-deb -c bin/*.deb)"
          grep -q ' ./etc/apparmor.d/docklet$' <<< "$deb_contents"
          reported="$(./bin/docklet --version)"
          echo "$reported"
          echo "$reported" | grep -qx "Docklet $VERSION"
          ls -l bin
          mkdir -p dist
          appimage=$(ls bin/*.AppImage | head -n 1)
          deb=$(ls bin/*.deb | head -n 1)
          mv "$appimage" "dist/docklet-$VERSION-linux-${{ matrix.arch }}.AppImage"
          mv "$deb" "dist/docklet-$VERSION-linux-${{ matrix.arch }}.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Optional: if the macOS build fails, the release goes out without it.
  macos:
    name: macOS (arm64)
    needs: [prepare, ci]
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Signing and notarisation would go here (no Apple certificate is available).
      - name: Package .app
        shell: bash
        run: |
          set -euo pipefail
          wails3 package "VERSION=$VERSION"
          mkdir -p dist
          ditto -c -k --keepParent bin/docklet.app "dist/docklet-$VERSION-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Publishes the release from whatever the build jobs produced. Only Windows must succeed (Linux and macOS
  # builds are new and unproven): other platforms are included when they produced an artifact, skipped otherwise.
  release:
    name: Create GitHub Release
    needs: [prepare, windows, linux, macos]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      # Missing optional artifacts simply do not appear in dist/.
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          args=(--title "Docklet $VERSION" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          # For a tag push the tag exists; for a manual run it is created on this commit.
          # --target is passed only when the tag has to be created: GitHub answers 403 to this token for a
          # target commit whose workflow files differ from the default branch, even when the tag exists.
          # So a manual run must start from main (or from a commit with the same workflow files).
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists: uploading its files again."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${args[@]}"
          fi
