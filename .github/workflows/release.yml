name: Release

# Push a tag like v0.2.0 (or v0.2.0-rc.1 for a pre-release), or run this workflow by hand with a version.
# A manual run creates the tag on the commit it was started from.
# Runners: every job runs on a GitHub-hosted machine.
# The shared setup (Go, Node, Wails CLI, bindings, frontend build) is .github/actions/setup.
# Rerunning a run whose release already exists adds or replaces its files.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 or 0.2.0-rc.1 (without the leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        name: Derive version from the tag or input
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then raw="$INPUT_VERSION"; else raw="$REF_NAME"; fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a valid version (expected 1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # The gate: the whole CI workflow runs on the commit being released. Nothing is built unless it passes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Builds every platform; Windows is required, Linux arm64 and macOS are optional (see build.yml).
  build:
    name: Build
    needs: [prepare, ci]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  # Publishes the release from whatever the build jobs produced. Only Windows must succeed (Linux and macOS
  # builds are new and unproven): other platforms are included when they produced an artifact, skipped otherwise.
  release:
    name: Create GitHub Release
    needs: [prepare, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      # Missing optional artifacts simply do not appear in dist/.
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          args=(--title "Docklet $VERSION" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          # For a tag push the tag exists; for a manual run it is created on this commit.
          # --target is passed only when the tag has to be created: GitHub answers 403 to this token for a
          # target commit whose workflow files differ from the default branch, even when the tag exists.
          # So a manual run must start from main (or from a commit with the same workflow files).
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists: uploading its files again."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${args[@]}"
          fi
