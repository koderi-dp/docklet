name: Release

# Push a tag like v0.2.0 (or v0.2.0-rc.1 for a pre-release), or run this workflow by hand with a version.
# A manual run creates the tag on the commit it was started from.
# Runners: jobs run on the self-hosted Windows runner (labels self-hosted, Windows, X64) unless the
# repository variable HOSTED_RUNNERS is 'true', which switches back to GitHub-hosted machines and enables the
# native Linux and macOS jobs. Linux is covered on the self-hosted runner by a Docker container when the
# variable RUNNER_HAS_DOCKER is 'true' (the runner's service account must be allowed to use Docker).
# macOS installers are only built on GitHub-hosted runners.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 or 0.2.0-rc.1 (without the leading v)"
        required: true
        type: string

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0
  NODE_VERSION: "22"

jobs:
  prepare:
    name: Resolve version
    runs-on: ${{ fromJSON(vars.HOSTED_RUNNERS == 'true' && '"ubuntu-24.04"' || '["self-hosted","Windows","X64"]') }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      # On a self-hosted Windows machine plain "bash" can resolve to the WSL launcher in System32.
      - name: Use Git Bash on the self-hosted runner
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: '"C:/Program Files/Git/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - id: v
        name: Derive version from the tag or input
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then raw="$INPUT_VERSION"; else raw="$REF_NAME"; fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a valid version (expected 1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # Required. Runs the same checks as CI, then builds one installer per architecture, one after the other.
  # Only amd64 is built unless the repository variable WINDOWS_ARCHES lists more, e.g. 'amd64 arm64'.
  windows:
    name: Windows (${{ vars.WINDOWS_ARCHES || 'amd64' }})
    needs: prepare
    runs-on: ${{ fromJSON(vars.HOSTED_RUNNERS == 'true' && '"windows-latest"' || '["self-hosted","Windows","X64"]') }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCHES: ${{ vars.WINDOWS_ARCHES || 'amd64' }}
    steps:
      - uses: actions/checkout@v4

      # On a self-hosted Windows machine plain "bash" can resolve to the WSL launcher in System32.
      - name: Use Git Bash on the self-hosted runner
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: '"C:/Program Files/Git/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its caches on disk; uploading them to GitHub only costs time.
          cache: ${{ runner.environment != 'self-hosted' }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet . ./internal/...

      - name: Go tests
        run: go test ./internal/...

      - name: Install NSIS
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v makensis > /dev/null 2>&1 && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      # `wails3 package VERSION=...` embeds the version (-X docklet/internal/version.Version) in the binary.
      # The architecture is chosen with GOARCH; both builds write bin/docklet.exe and
      # bin/docklet-<arch>-installer.exe, so each output is renamed straight away.
      # Signing: no certificate is available. Sign the .exe before packaging and the installer after
      # (`wails3 task windows:sign` / `windows:sign:installer`, see build/windows/Taskfile.yml).
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in $ARCHES; do
            GOARCH="$arch" wails3 package "VERSION=$VERSION"
            if [[ "$arch" == "amd64" ]]; then
              reported="$(./bin/docklet.exe --version)"
              echo "$reported"
              echo "$reported" | grep -qx "Docklet $VERSION"
            fi
            mv bin/docklet.exe "dist/docklet-$VERSION-windows-$arch.exe"
            mv "bin/docklet-$arch-installer.exe" "dist/docklet-$VERSION-windows-$arch-installer.exe"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Required. Linux packages: AppImage and .deb. arm64 runs on GitHub's ubuntu-24.04-arm runner and is optional.
  linux:
    name: Linux (${{ matrix.arch }})
    if: vars.HOSTED_RUNNERS == 'true'
    needs: prepare
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, appimage_arch: x86_64, optional: false }
          - { arch: arm64, runner: ubuntu-24.04-arm, appimage_arch: aarch64, optional: true }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its caches on disk; uploading them to GitHub only costs time.
          cache: ${{ runner.environment != 'self-hosted' }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev file

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      # Only the AppImage and the .deb are published (the scaffold can also make .rpm and Arch packages).
      # Names produced by the tools are matched with globs and renamed to the release asset names.
      - name: Package (AppImage and deb)
        shell: bash
        env:
          GIT_COMMITTER_NAME: Danijel
        run: |
          set -euo pipefail
          wails3 task linux:create:appimage "VERSION=$VERSION"
          wails3 task linux:create:deb "VERSION=$VERSION"
          # The profile that lets WebKit's sandbox start on Ubuntu 24.04 must be in the package.
          # Capture the listing first: `grep -q` exits at the first match and would make dpkg-deb fail under pipefail.
          deb_contents="$(dpkg-deb -c bin/*.deb)"
          grep -q ' ./etc/apparmor.d/docklet$' <<< "$deb_contents"
          reported="$(./bin/docklet --version)"
          echo "$reported"
          echo "$reported" | grep -qx "Docklet $VERSION"
          ls -l bin
          mkdir -p dist
          appimage=$(ls bin/*.AppImage | head -n 1)
          deb=$(ls bin/*.deb | head -n 1)
          mv "$appimage" "dist/docklet-$VERSION-linux-${{ matrix.arch }}.AppImage"
          mv "$deb" "dist/docklet-$VERSION-linux-${{ matrix.arch }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Linux packages on the self-hosted Windows runner, built in a Docker container (amd64 only).
  linux-container:
    name: Linux (amd64, container)
    if: vars.HOSTED_RUNNERS != 'true' && vars.RUNNER_HAS_DOCKER == 'true'
    needs: prepare
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the Linux toolchain image
        shell: pwsh
        run: |
          $go = (Select-String -Path go.mod -Pattern '^go ([0-9.]+)').Matches[0].Groups[1].Value
          docker build -f .github/ci/linux.Dockerfile --build-arg "GO_VERSION=$go" --build-arg "WAILS_VERSION=$env:WAILS_VERSION" -t docklet-ci-linux .github/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (AppImage and deb) in the container
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "linux-out"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $out | Out-Null
          docker run --rm -v "${env:GITHUB_WORKSPACE}:/src:ro" -v "${out}:/out" -v docklet-ci-gomod:/root/go/pkg/mod -v docklet-ci-gobuild:/root/.cache/go-build -v docklet-ci-npm:/root/.npm docklet-ci-linux bash /src/.github/scripts/linux-package.sh "$env:VERSION" amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: ${{ runner.temp }}/linux-out/*
          if-no-files-found: error
          retention-days: 7

  # Optional: the macOS build has never run anywhere yet. If it fails, the release goes out without it.
  macos:
    name: macOS (arm64)
    if: vars.HOSTED_RUNNERS == 'true'
    needs: prepare
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its caches on disk; uploading them to GitHub only costs time.
          cache: ${{ runner.environment != 'self-hosted' }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        run: wails3 generate bindings -clean=true -ts -i

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      # Signing and notarisation would go here (no Apple certificate is available).
      - name: Package .app
        shell: bash
        run: |
          set -euo pipefail
          wails3 package "VERSION=$VERSION"
          mkdir -p dist
          ditto -c -k --keepParent bin/docklet.app "dist/docklet-$VERSION-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Publishes the release from whatever the build jobs produced. Only Windows must succeed (Linux and macOS
  # builds are new and unproven): other platforms are included when they produced an artifact, skipped otherwise.
  release:
    name: Create GitHub Release
    needs: [prepare, windows, linux, linux-container, macos]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ${{ fromJSON(vars.HOSTED_RUNNERS == 'true' && '"ubuntu-24.04"' || '["self-hosted","Windows","X64"]') }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      # On a self-hosted Windows machine plain "bash" can resolve to the WSL launcher in System32.
      - name: Use Git Bash on the self-hosted runner
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: '"C:/Program Files/Git/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      # Missing optional artifacts simply do not appear in dist/.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          args=(--title "Docklet $VERSION" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          # For a tag push the tag exists; for a manual run it is created on this commit.
          gh release create "$TAG" dist/* "${args[@]}" --target "$GITHUB_SHA"
