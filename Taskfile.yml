version: '3'

vars:
  APP_NAME: "docklet"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  # Embedded in the binary as docklet/internal/version.Version. Override with `wails3 build VERSION=0.2.0`;
  # the default is the version in build/config.yml.
  VERSION:
    sh: |
      grep -m1 '^  version:' build/config.yml | cut -d ' ' -f4 | tr -cd '0-9A-Za-z.+-'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Ports of `dev:browser`; different from VITE_PORT so it can run next to `wails3 dev`.
  BROWSER_PORT: '{{.BROWSER_PORT | default 9250}}'
  BROWSER_BACKEND_PORT: '{{.BROWSER_BACKEND_PORT | default 9251}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  dev:browser:
    summary: Runs the real backend in server mode and the UI in a browser, with hot reload
    desc: |
      Opens no desktop window. The Go backend runs in Wails server mode on BROWSER_BACKEND_PORT and Vite
      serves the UI with hot reload on BROWSER_PORT, forwarding /wails to the backend.
      Open http://localhost:{{.BROWSER_PORT}} in a browser.

      It is the real backend: actions change real containers. The port has no authentication and is
      bound to localhost only; stop the task when you are done. Go changes need a restart.
    deps:
      - dev:browser:backend
      - dev:browser:frontend

  dev:browser:backend:
    internal: true
    deps:
      - task: common:build:server
        vars:
          DEV: "true"
    env:
      WAILS_SERVER_HOST: localhost
      WAILS_SERVER_PORT: "{{.BROWSER_BACKEND_PORT}}"
    cmds:
      - '"./{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"'

  dev:browser:frontend:
    internal: true
    dir: frontend
    env:
      DOCKLET_SERVER_URL: "http://localhost:{{.BROWSER_BACKEND_PORT}}"
    cmds:
      - npm run dev -- --port {{.BROWSER_PORT}} --strictPort

  e2e:
    summary: Runs the end-to-end tests (Playwright against Docklet and a throwaway Docker engine)
    desc: |
      Needs Docker on this machine. Builds Docklet for Linux in server mode, starts the test stack
      (e2e/docker-compose.yml: a Docker-in-Docker engine with SSH, a registry and Docklet) and runs the
      Playwright tests in e2e/tests against http://localhost:9260. The stack stays up afterwards for the
      next run; remove it with `wails3 task e2e:down`. A failed test leaves a trace in e2e/test-results.
    deps:
      - e2e:up
    dir: e2e
    cmds:
      - npm ci
      - npx playwright install chromium
      - npx playwright test

  e2e:up:
    summary: Builds and starts the end-to-end test stack
    deps:
      - e2e:build
    cmds:
      - docker compose -f e2e/docker-compose.yml up -d --build --wait

  e2e:down:
    summary: Removes the end-to-end test stack and its volumes
    cmds:
      - docker compose -f e2e/docker-compose.yml down -v

  e2e:build:
    summary: Cross-compiles Docklet in server mode for the test stack (Linux, no cgo)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS: "-tags server,production"
    env:
      GOOS: linux
      GOARCH: "{{ARCH}}"
      CGO_ENABLED: "0"
    cmds:
      - go build -tags server,production -trimpath -buildvcs=false -ldflags="-w -s" -o e2e/.build/docklet-server .

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
